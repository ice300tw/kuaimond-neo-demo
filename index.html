<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>業務王 2077 Neo — 示範版</title>
<style>
:root{--bg:#070A12;--cyan:#22D3EE;--mag:#A855F7;--amber:#F59E0B;--green:#34D399;--red:#F87171;--txt:#E5E7EB;--dim:#94A3B8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:15px/1.6 -apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;min-height:100vh;
background-image:radial-gradient(800px 500px at 85% -10%,rgba(168,85,247,.28),transparent 60%),radial-gradient(700px 420px at -10% 15%,rgba(34,211,238,.22),transparent 60%)}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 80px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--cyan),var(--mag));box-shadow:0 0 24px rgba(34,211,238,.45);display:grid;place-items:center;font-weight:800;color:#04121a}
h1{font-size:20px;letter-spacing:.5px}
.badge{font-size:12px;padding:3px 10px;border-radius:99px;background:rgba(245,158,11,.14);color:var(--amber);border:1px solid rgba(245,158,11,.35)}
.sub{color:var(--dim);font-size:13px;margin-top:2px}
.grid{display:grid;gap:16px}
.hero{grid-template-columns:1.1fr 1fr;margin-top:26px}
.card{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:18px;backdrop-filter:blur(10px)}
.ring{display:flex;align-items:center;gap:20px}
.stat{display:flex;flex-direction:column;gap:2px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.04)}
.stat b{font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--dim)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tabbar{display:flex;gap:8px;margin:26px 0 14px;flex-wrap:wrap}
.tab{padding:9px 18px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:transparent;color:var(--dim);font-size:14px;cursor:pointer}
.tab.on{background:var(--cyan);color:#04121a;font-weight:700;border-color:transparent}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);margin-bottom:10px}
.row .nm{font-weight:600}
.row .meta{font-size:12px;color:var(--dim)}
.row .right{margin-left:auto;text-align:right}
.pill{font-size:11px;padding:2px 9px;border-radius:99px;border:1px solid}
.vip{color:var(--amber);border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.1)}
.imp{color:var(--cyan);border-color:rgba(34,211,238,.4);background:rgba(34,211,238,.1)}
.pot{color:var(--dim);border-color:rgba(255,255,255,.15)}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.col{min-width:220px;flex:1;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:12px}
.col h4{font-size:12px;color:var(--dim);letter-spacing:.5px;margin-bottom:10px;display:flex;justify-content:space-between}
.deal{background:rgba(255,255,255,.05);border-radius:12px;padding:10px;margin-bottom:8px;border-left:3px solid var(--cyan)}
.deal b{font-size:13px;display:block}
.deal small{color:var(--dim);font-size:11px}
.money{color:var(--green);font-size:12px}
footer{margin-top:44px;padding-top:18px;border-top:1px solid rgba(255,255,255,.08);color:var(--dim);font-size:12px}
@media(max-width:760px){.hero{grid-template-columns:1fr}.tiles{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo">王</div>
  <div>
    <h1>業務王 2077 Neo</h1>
    <div class="sub">未來感業務座艙 · 示範資料</div>
  </div>
  <span class="badge">DEMO 示範版</span>
</header>

<section class="grid hero">
  <div class="card">
    <div class="ring">
      <svg width="108" height="108" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="50" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="10"/>
        <circle cx="60" cy="60" r="50" fill="none" stroke="url(#g)" stroke-width="10" stroke-linecap="round"
          stroke-dasharray="314" stroke-dashoffset="66" transform="rotate(-90 60 60)"/>
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#A855F7"/>
        </linearGradient></defs>
        <text x="60" y="58" text-anchor="middle" fill="#E5E7EB" font-size="26" font-weight="700">79</text>
        <text x="60" y="76" text-anchor="middle" fill="#94A3B8" font-size="11">S 級戰力</text>
      </svg>
      <div style="display:flex;flex-direction:column;gap:8px">
        <div class="stat"><b>NT$2,860,000</b><span>本月成交</span></div>
        <div class="stat"><b>4</b><span>進行中機會</span></div>
      </div>
    </div>
  </div>
  <div class="tiles">
    <div class="card"><div class="stat"><b>6</b><span>客戶總數</span></div></div>
    <div class="card"><div class="stat"><b>2</b><span>貴賓客戶</span></div></div>
    <div class="card"><div class="stat"><b>NT$860,000</b><span>待成交金額</span></div></div>
    <div class="card"><div class="stat"><b>2</b><span>今日待辦</span></div></div>
  </div>
</section>

<div class="tabbar">
  <button class="tab on" data-tab="clients">客戶</button>
  <button class="tab" data-tab="deals">機會</button>
  <button class="tab" data-tab="todos">待辦</button>
</div>

<section id="clients"></section>
<section id="deals" hidden></section>
<section id="todos" hidden></section>

<footer>
  本頁為 <b>業務王 2077 Neo</b> 的公開示範版，所有客戶、公司、金額、待辦均為<b>虛構資料</b>，僅供展示介面與流程之用，與任何真實企業或個人無關。
</footer>
</div>
<script>
const clients=[
 {n:"林志明",c:"宏芯包材股份有限公司",p:"0912-345-001",l:"vip"},
 {n:"王雅婷",c:"佳泓電子工業",p:"0922-345-002",l:"imp"},
 {n:"陳建宏",c:"永盛紙業",p:"0933-345-003",l:"vip"},
 {n:"黃淑芬",c:"立揚科技的包裝部",p:"0955-345-004",l:"imp"},
 {n:"張文豪",c:"台欣物流",p:"0966-345-005",l:"pot"},
 {n:"吳美玲",c:"新美塑膠",p:"0977-345-006",l:"pot"}
];
const deals=[
 {t:"年約緩衝包材",c:"宏芯包材",v:"NT$ 1,280,000",s:0},
 {t:"EPE 成型內襯",c:"佳泓電子",v:"NT$ 760,000",s:1},
 {t:"彩盒改版打樣",c:"永盛紙業",v:"NT$ 320,000",s:2},
 {t:"自動封箱線耗材",c:"台欣物流",v:"NT$ 500,000",s:3}
];
const todos=[
 {t:"回覆宏芯包材報價",d:"今天 17:00",p:"緊急",due:"今天"},
 {t:"佳泓電子打樣確認",d:"明天 10:00",p:"一般",due:"明天"},
 {t:"永盛紙業合約用印",d:"11/03",p:"一般",due:"3 天後"}
];
const lv={vip:["貴賓","vip"],imp:["重要","imp"],pot:["潛在","pot"]};
const stages=["開發中","報價中","打樣中","談判中"];
document.getElementById('clients').innerHTML=clients.map(c=>{
 const [t,cls]=lv[c.l];
 return `<div class="row"><div><div class="nm">${c.n}</div><div class="meta">${c.c} · ${c.p}</div></div>
 <div class="right"><span class="pill ${cls}">${t}</span></div></div>`;
}).join('');
document.getElementById('deals').innerHTML='<div class="board">'+stages.map((st,i)=>
 `<div class="col"><h4><span>${st}</span><span>${deals.filter(d=>d.s===i).length}</span></h4>`+
 deals.filter(d=>d.s===i).map(d=>`<div class="deal"><b>${d.t}</b><small>${d.c}</small><div class="money">${d.v}</div></div>`).join('')+
 `</div>`).join('')+'</div>';
document.getElementById('todos').innerHTML=todos.map(t=>
 `<div class="row"><div><div class="nm">${t.t}</div><div class="meta">${t.d} · ${t.p}</div></div>
 <div class="right"><span class="pill ${t.p==='緊急'?'vip':'pot'}">${t.due}</span></div></div>`).join('');
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
 b.classList.add('on');
 ['clients','deals','todos'].forEach(id=>document.getElementById(id).hidden=(id!==b.dataset.tab));
});
</script>
</body>
</html>
